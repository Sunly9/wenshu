spring:
  application:
    name: wenshu
  datasource:
    url: jdbc:postgresql://localhost:5432/wenshu
    username: wenshu
    password: wenshu123        # 仅本地开发环境
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate       # 表结构只由 Flyway 建，JPA 只校验
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 16379             # 宿主机 6379 被本机 redis-server 占用，dev 容器映射在 16379
  servlet:
    multipart:
      max-file-size: 50MB      # 00 号文档 §6：单文档上限 50MB
      max-request-size: 60MB

server:
  port: 8080

wenshu:
  storage-dir: ./data/uploads   # 上传文件落盘目录（data/ 已在 .gitignore）
  embedding:
    model-dir: ./models/bge-small-zh-v1.5   # model.onnx + tokenizer.json（models/ 已在 .gitignore）
  llm:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}   # 从环境变量读取，绝不写入文件
    model: deepseek-chat

management:
  endpoint:
    health:
      show-details: always      # 本地开发排查用，生产关闭
  endpoints:
    web:
      exposure:
        include: health,info
